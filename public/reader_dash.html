<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reader Dashboard</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <h1>Welcome, Reader</h1>
    <div id="blogs-list">
        <h2>Blogs</h2>
        <!-- Dynamically loaded blogs will appear here -->
    </div>

    <div id="comment-form" style="display:none;">
        <h2>Add a Comment</h2>
        <form id="add-comment-form">
            <label for="comment-content">Comment</label><br>
            <textarea id="comment-content" name="content" rows="3" required></textarea><br><br>

            <button type="submit">Add Comment</button>
        </form>
    </div>
	<script src="js/reader_dash.js"></script>
</body>
</html>
