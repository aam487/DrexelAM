<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Reader dashboard title -->
    <title>Reader Dashboard - BlogHub</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <!-- Welcome the reader -->
        <h1>Welcome, Reader</h1>
        <p class="text-center">Discover interesting blogs and share your thoughts</p>
        
        <div class="dashboard-content">
            <h2>Blogs</h2>
            <div id="sort-options">
                <button id="sort-toggle" class="button">Sort by Comments</button>
              </div>
            <!-- Blogs will display in a responsive grid -->
            <div id="blogs-list"></div>
            
            <!-- Comment form - hidden by default -->
            <div id="comment-form" style="display:none;">
                <h2>Add a Comment</h2>
                <form id="add-comment-form">
                    <label for="comment-content">Comment</label>
                    <textarea id="comment-content" name="content" rows="3" required></textarea>
                    <div class="action-buttons">
                        <!-- Add comment or cancel -->
                        <button type="submit" class="button">Add Comment</button>
                        <button type="button" id="cancel-comment" class="button1">Cancel</button>
                    </div>
                </form>
            </div>
            
            <div class="dashboard-actions">
                <button id="logout" class="button1" onclick="window.location.href='welcomepage.html'">Log Out</button>
            </div>
        </div>
    </div>
    <script src="js/reader_dash.js"></script>
</body>
</html>
