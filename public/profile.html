<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - BlogHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="profile">
            <h1>Edit Profile</h1>
            <p class="text-center">Manage your account information</p>
            <form id="profile-form">
                <input type="text" id="username" placeholder="Enter your name">
                <input type="email" id="email" placeholder="Enter your email">
                <input type="password" id="password" placeholder="Enter new password">
                <select id="role">
                    <option value="">Select Role</option>
                    <option value="reader">Reader</option>
                    <option value="author">Author</option>
                    <option value="moderator">Moderator</option>
                </select>
                <div class="action-buttons">
                    <button type="submit" id="saveProfile" class="button">Save Changes</button>
                    <button type="button" id="logout" class="button1" onclick="window.location.href='welcomepage.html'">Log Out</button>
                </div>
            </form>
        </div>
    </div>
    <script src="js/profile.js"></script>
</body>
</html>
