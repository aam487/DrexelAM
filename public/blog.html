<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Details - BlogHub</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <div class="blog-detail-container">
            <h1 id="blog-title"></h1>
            <p id="blog-author"></p>
            <p id="blog-timestamp"></p>
            <div id="blog-content"></div>

            
            <!-- Comments section -->
            <div class="comment-section">
                <h3>Comments</h3>
                <div id="comments-list"></div>
                
                <!-- Add comment form -->
                <div class="add-comment">
                    <h4>Add a Comment</h4>
                    <form id="add-comment-form">
                        <textarea id="comment-content" placeholder="Write your comment..."></textarea>
                        <div class="action-buttons">
                            <button type="submit" class="button">Submit</button>
                            <button type="button" id="cancel-comment" class="button1">Cancel</button>
                        </div>
                    </form>
                </div>
                
            </div>
            
            <div class="blog-actions">
                <button class="button1" onclick="history.back()">Back</button>
            </div>
        </div>
    </div>
    <script src="/js/blog.js"></script>
    <script>
        // Fetch the session info from the server and store the user ID in a global variable
        fetch('/session/info', { credentials: 'same-origin' })
          .then(response => response.json())
          .then(data => {
            window.currentUserId = data.userId;
          })
          .catch(err => console.error('Error retrieving session info:', err));
      </script>
      
</body>
</html>
