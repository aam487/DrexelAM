<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Author Dashboard - Quill & Query</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <!-- Welcome message header -->
        <h1>Welcome, Author</h1>
        <p class="text-center">Create and manage your blog posts</p>
        <!-- Create blog button -->
        <div class="dashboard-content">
            <div class="dashboard-actions">
                <button id="create-blog-button" class="button">Create New Blog</button>
            </div>
            
            <!-- Form for creating a blog with title and content -->
            <div id="create-blog-container" style="display:none;">
                <h2>Create New Blog Post</h2>
                <form id="create-blog-form">
                    <label for="blog-title">Title</label>
                    <input type="text" id="blog-title" name="title" required>
                    
                    <label for="blog-content">Content</label>
                    <textarea id="blog-content" name="content" rows="5" required></textarea>
                    <!-- Buttons to submit or cancel -->
                    <div class="action-buttons">
                        <button type="submit" class="button">Create Blog</button>
                        <button type="button" id="cancel-blog" class="button1">Cancel</button>
                    </div>
                </form>
            </div>
            <!-- List of author's blogs -->
            <h2>Your Blogs</h2>
            <div id="sort-options">
                <button id="sort-toggle" class="button">Sort by Comments</button>
            </div>              
            <!-- Author's blogs will display in a responsive grid -->
            <div id="blogs-list"></div>
            <!-- Logout and go to welcome page -->
            <div class="dashboard-actions">
                <button id="logout" class="button1" onclick="window.location.href='welcomepage.html'">Log Out</button>
            </div>
        </div>
    </div>
    <script src="js/author_dash.js"></script>
</body>
</html>
